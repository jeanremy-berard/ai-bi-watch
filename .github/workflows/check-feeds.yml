name: Check feeds

on:
  workflow_dispatch:
  push:
    paths:
      - config/sources.yaml

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check every source
        run: python -m watch.feedcheck

      - name: Publish status to the job summary
        run: cat data/feed_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit status
        run: |
          git config user.name "ai-bi-watch bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed_status.md
          git diff --cached --quiet && exit 0
          git commit -m "data: feed status $(date -u +%F)"
          git pull --rebase
          git push
