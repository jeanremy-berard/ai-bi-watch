name: Weekly digest

on:
  schedule:
    # Friday 21:41 Paris time. GitHub fires scheduled workflows late on this repo
    # (5-7 hours observed in October 2026), so a Friday evening slot is what
    # gets the digest ready before Saturday 07:00. The digest is still
    # labelled with Saturday's date (see watch/digest.py: week_ending).
    - cron: "41 21 * * 5"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days"
        default: "7"

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Last-minute ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m watch.ingest

      - name: Write digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m watch.digest --days "${{ inputs.days || '7' }}"

      - name: Publish digest to the job summary
        run: cat digests/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: always()
        run: |
          git config user.name "ai-bi-watch bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data digests
          git diff --cached --quiet && exit 0
          git commit -m "digest: week ending $(date -u +%F)"
          git pull --rebase
          git push
