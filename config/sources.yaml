# Curated source list. This list IS the first quality filter: anything not in here
# never reaches the classifier.
#
# Fields
#   name      display name (unique)
#   url       feed URL (RSS/Atom), or the API URL for type hf_papers
#   type      rss (default) | hf_papers
#   group     hint for the classifier; the final category is decided per item
#   tier      1 = primary/official, 2 = trusted individual or analysis, 3 = aggregator
#   include   optional list of regexes (case-insensitive) on title+summary;
#             items matching none are skipped before any API call (cheap prefilter
#             for broad or noisy feeds)
#   max_items optional cap per run (default: settings.max_items_per_source)
#   enabled   false to park a source without deleting it
#
# "verified" comments = feed confirmed reachable when this list was written.
# Everything else is checked by the "Check feeds" workflow, which writes
# data/feed_status.md. Dead feeds show up there and in the digest footer.

settings:
  lookback_days: 3          # ignore entries published before this (first run uses bootstrap_days)
  bootstrap_days: 7
  max_items_per_source: 15
  fulltext_min_chars: 1500  # fetch the article page when the feed gives less text than this
  fulltext_max_chars: 8000
  classify_model: claude-haiku-5-5
  digest_model: claude-sonnet-5-5
  practice_window_days: 28  # BI practice pieces stay eligible for the digest this long

sources:
