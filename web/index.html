<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI & BI Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  --paper: #f6f7f9;
  --sheet: #ffffff;
  --ink: #17202b;
  --muted: #5e6b7a;
  --faint: #8a96a3;
  --rule: #dce1e7;
  --petrol: #0e5a63;
  --petrol-soft: #e1eff0;
  --off: #cfd6dd;
  --drop: #9a4b3c;
  --drop-soft: #f6e9e6;
  --c-ai_releases: #3b5bdb;
  --c-ai_engineering: #0b7285;
  --c-ai_research: #7048e8;
  --c-bi_microsoft: #e67700;
  --c-bi_market: #5c940d;
  --c-bi_practice: #a61e4d;
  --c-access_licensing: #c92a2a;
  --c-none: #868e96;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12171d; --sheet: #182029; --ink: #e6eaee; --muted: #9aa6b2; --faint: #6f7c89;
    --rule: #2a343e; --petrol: #63b7c0; --petrol-soft: #1b3236; --off: #34404b;
    --drop: #e39a89; --drop-soft: #35221e;
    --c-ai_releases: #748ffc; --c-ai_engineering: #3bc9db; --c-ai_research: #9775fa;
    --c-bi_microsoft: #ffa94d; --c-bi_market: #94d82d; --c-bi_practice: #f06595;
    --c-access_licensing: #ff6b6b; --c-none: #adb5bd;
  }
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Schibsted Grotesk", system-ui, sans-serif; line-height: 1.55;
}
.cats .n, .count strong { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; }

header {
  display: flex; align-items: baseline; gap: 1.5rem; flex-wrap: wrap;
  padding: 1.25rem clamp(1rem, 3vw, 2rem) 1rem; border-bottom: 1px solid var(--rule);
}
.brand { font-size: 1.375rem; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.views { display: flex; gap: 0.25rem; }
.views button {
  background: none; border: 0; padding: 0.25rem 0.5rem; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent;
}
.views button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--petrol); }
.built { margin-left: auto; font-size: 0.8125rem; color: var(--faint); }

/* signal meter: the one bold device */
.signal { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; vertical-align: -2px; }
.signal i { display: block; width: 4px; background: var(--off); border-radius: 1px; }
.signal i:nth-child(1) { height: 4px; } .signal i:nth-child(2) { height: 7px; }
.signal i:nth-child(3) { height: 10px; } .signal i:nth-child(4) { height: 13px; }
.signal i:nth-child(5) { height: 16px; }
.signal i.on { background: var(--petrol); }
.dropped .signal i.on { background: var(--faint); }

.sigpicker { display: flex; align-items: flex-end; gap: 4px; height: 40px; }
.sigpicker button {
  width: 22px; border: 0; padding: 0; border-radius: 2px; cursor: pointer; background: var(--off);
}
.sigpicker button.on { background: var(--petrol); }
.sigpicker button:nth-child(1) { height: 8px; } .sigpicker button:nth-child(2) { height: 16px; }
.sigpicker button:nth-child(3) { height: 24px; } .sigpicker button:nth-child(4) { height: 32px; }
.sigpicker button:nth-child(5) { height: 40px; }

main { padding: 0 clamp(1rem, 3vw, 2rem) 4rem; }
.explorer { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 2.5rem; }
aside { padding-top: 1.5rem; }
aside section { margin-bottom: 1.5rem; }
aside h2 { font-size: 0.875rem; font-weight: 600; margin: 0 0 0.5rem; }
aside .hint { font-size: 0.8125rem; color: var(--muted); margin: 0.375rem 0 0; }
.presets { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 0.5rem; }
.presets button, .seg button {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px;
  padding: 0.125rem 0.5rem; font-size: 0.8125rem; cursor: pointer;
}
.presets button.on, .seg button.on { border-color: var(--petrol); background: var(--petrol-soft); color: var(--petrol); }
.dates { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.375rem; }
.dates input { min-width: 0; }
.dates input, .search, select {
  width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px;
  padding: 0.3125rem 0.5rem; font-size: 0.8125rem;
}
.cats label {
  display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; padding: 0.1875rem 0; cursor: pointer;
}
.cats input { accent-color: var(--petrol); margin: 0; }
.cats .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.cats .n { margin-left: auto; color: var(--faint); font-size: 0.8125rem; }
.seg { display: flex; gap: 0.25rem; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--petrol); cursor: pointer; font-size: 0.8125rem; text-decoration: underline; }

.strip { padding: 1.5rem 0 0.75rem; border-bottom: 1px solid var(--rule); }
.strip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.count { font-size: 1rem; margin: 0; }
.count strong { font-weight: 600; }
.sort { width: auto; }
.hist { display: flex; align-items: flex-end; gap: 2px; height: 48px; margin-top: 0.75rem; }
.hist div { flex: 1; display: flex; flex-direction: column-reverse; min-width: 2px; }
.hist .k { background: var(--petrol); } .hist .d { background: var(--off); }
.hist-axis { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--faint); margin-top: 0.25rem; }

.list { list-style: none; margin: 0; padding: 0; }
.item { padding: 1.125rem 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0.25rem 0.75rem; }
.item .signal { margin-top: 4px; }
.item h3 { font-size: 1.0625rem; font-weight: 500; margin: 0; line-height: 1.35; }
.item h3 a { text-decoration: none; }
.item h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 0.25rem 0.875rem; font-size: 0.8125rem; color: var(--muted); }
.meta .cat { display: inline-flex; align-items: center; gap: 0.375rem; }
.meta .cat::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--cc); }
.summary { grid-column: 2; margin: 0.375rem 0 0; font-size: 0.9375rem; }
.why { grid-column: 2; margin: 0.25rem 0 0; font-size: 0.9375rem; color: var(--muted); }
.why b { font-weight: 500; color: var(--ink); }
.rule { grid-column: 2; margin: 0.375rem 0 0; font-size: 0.875rem; color: var(--drop); }
.rule span { background: var(--drop-soft); border-radius: 3px; padding: 0 0.375rem; margin-right: 0.375rem; }
.dropped h3 { color: var(--muted); }
.acts { grid-column: 2; display: flex; gap: 0.5rem; margin-top: 0.5rem; }
.acts button {
  background: none; border: 1px solid var(--rule); border-radius: 4px; cursor: pointer;
  font-size: 0.8125rem; padding: 0 0.5rem; color: var(--muted);
}
.acts button[aria-pressed="true"] { border-color: var(--petrol); color: var(--petrol); background: var(--petrol-soft); }
.empty { padding: 3rem 0; color: var(--muted); max-width: 50ch; }

.digest { max-width: 74ch; margin: 0 auto; padding-top: 1.5rem; }
.digest-bar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
.digest-bar select { width: auto; }
.md h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; margin: 0.5rem 0 1.25rem; }
.md h2 { font-size: 1.125rem; font-weight: 600; margin: 2.25rem 0 0.5rem; padding-top: 1rem; border-top: 2px solid var(--ink); }
.md h3 { font-size: 1.0625rem; font-weight: 500; margin: 1.5rem 0 0.25rem; }
.md p, .md li { font-size: 1rem; }
.md strong { font-weight: 600; }
.md hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0 0; }
.md details { font-size: 0.9375rem; color: var(--muted); }
.md .signal { margin-right: 0.25rem; }
.md table { border-collapse: collapse; font-size: 0.875rem; }
.md td, .md th { border-bottom: 1px solid var(--rule); padding: 0.25rem 0.75rem 0.25rem 0; text-align: left; }

.filters-toggle { display: none; }
@media (max-width: 820px) {
  .explorer { grid-template-columns: 1fr; gap: 0; }
  .filters-toggle { display: block; margin-top: 1rem; }
  aside { display: none; padding-top: 1rem; border-bottom: 1px solid var(--rule); }
  aside.open { display: block; }
  .built { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .hist div > * { transition: height 160ms ease-out; }
}
</style>
</head>
<body>
<header>
  <h1 class="brand">AI & BI Watch</h1>
  <nav class="views" role="tablist" aria-label="View">
    <button role="tab" id="tab-digest" aria-selected="true" data-view="digest">Digest</button>
    <button role="tab" id="tab-explorer" aria-selected="false" data-view="explorer">Explorer</button>
  </nav>
  <span class="built" id="built"></span>
</header>

<main>
  <section id="view-digest" class="digest" role="tabpanel" aria-labelledby="tab-digest">
    <div class="digest-bar">
      <label for="digest-pick" style="font-size:0.875rem;color:var(--muted)">Week ending</label>
      <select id="digest-pick"></select>
    </div>
    <article class="md" id="digest-body"><p class="empty">Loading…</p></article>
  </section>

  <section id="view-explorer" class="explorer" role="tabpanel" aria-labelledby="tab-explorer" hidden>
    <button class="filters-toggle presets" id="filters-toggle" aria-expanded="false" aria-controls="filters">Filters</button>
    <aside id="filters">
      <section>
        <h2>Period</h2>
        <div class="presets" id="presets">
          <button data-days="7">7 days</button>
          <button data-days="30">30 days</button>
          <button data-days="90">90 days</button>
          <button data-days="0">All</button>
        </div>
        <div class="dates">
          <input type="date" id="from" aria-label="From">
          <input type="date" id="to" aria-label="To">
        </div>
      </section>
      <section>
        <h2 id="sig-label">Minimum significance</h2>
        <div class="sigpicker" id="sigpicker" role="radiogroup" aria-labelledby="sig-label"></div>
        <p class="hint" id="sig-hint"></p>
      </section>
      <section>
        <h2>Show</h2>
        <div class="seg" id="keepseg">
          <button data-keep="kept">Kept</button>
          <button data-keep="dropped">Dropped</button>
          <button data-keep="all">Both</button>
        </div>
        <p class="hint">Dropped items show why the filter cut them.</p>
      </section>
      <section>
        <h2>Categories</h2>
        <div class="cats" id="cats"></div>
        <p class="hint"><button class="linkbtn" id="cats-all">All</button> &nbsp; <button class="linkbtn" id="cats-none">None</button></p>
      </section>
      <section>
        <h2><label for="source">Source</label></h2>
        <select id="source"><option value="">All sources</option></select>
      </section>
      <section>
        <h2><label for="q">Search</label></h2>
        <input class="search" id="q" type="search" placeholder="Fabric, agents, DuckDB">
      </section>
      <section>
        <h2>Your ratings</h2>
        <div class="seg" id="rateseg">
          <button data-rate="any">Any</button>
          <button data-rate="up">Useful</button>
          <button data-rate="down">Not useful</button>
        </div>
        <p class="hint">Ratings stay in this browser. <button class="linkbtn" id="export">Export</button></p>
      </section>
    </aside>

    <div>
      <div class="strip">
        <div class="strip-head">
          <p class="count" id="count" aria-live="polite"></p>
          <select class="sort" id="sort" aria-label="Sort">
            <option value="sig">Most significant first</option>
            <option value="date">Newest first</option>
          </select>
        </div>
        <div class="hist" id="hist" aria-hidden="true"></div>
        <div class="hist-axis" id="hist-axis" aria-hidden="true"></div>
      </div>
      <ol class="list" id="list"></ol>
    </div>
  </section>
</main>

<script>
const CATS = {
  access_licensing: "Access and licensing",
  ai_releases: "AI releases",
  ai_engineering: "AI engineering",
  ai_research: "Research",
  bi_microsoft: "Fabric and Power BI",
  bi_market: "BI market",
  bi_practice: "BI practice",
  none: "Uncategorized",
};
const SIG_HINTS = ["Everything, noise included", "Marginal and up", "Worth knowing and up", "Things you could adopt soon", "Landscape changes only"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let DATA = { items: [], digests: [] };
const ratings = store.get("aibw.ratings", {});
const saved = store.get("aibw.filters", {});
const state = Object.assign({
  days: 30, from: "", to: "", sig: 3, keep: "kept", cats: Object.keys(CATS),
  source: "", q: "", rate: "any", sort: "sig",
}, saved);

const signal = (n) => `<span class="signal" role="img" aria-label="Significance ${n} of 5">${[1,2,3,4,5].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
const isoDay = (d) => d.toISOString().slice(0, 10);

function range() {
  if (state.from || state.to) return [state.from || "0000", state.to || "9999"];
  if (!state.days) return ["0000", "9999"];
  const d = new Date(); d.setDate(d.getDate() - state.days + 1);
  return [isoDay(d), "9999"];
}

function filtered(ignoreCats = false) {
  const [a, b] = range();
  const q = state.q.trim().toLowerCase();
  return DATA.items.filter((x) =>
    x.date >= a && x.date <= b &&
    (state.keep === "all" || (state.keep === "kept") === x.kept) &&
    (!x.kept || x.sig >= state.sig) &&
    (ignoreCats || state.cats.includes(x.category)) &&
    (!state.source || x.source === state.source) &&
    (state.rate === "any" || (state.rate === "up" ? ratings[x.id] === 1 : ratings[x.id] === -1)) &&
    (!q || (x.title + " " + x.summary + " " + x.story + " " + x.source).toLowerCase().includes(q))
  );
}

function renderControls() {
  document.querySelectorAll("#presets button").forEach((b) =>
    b.classList.toggle("on", !state.from && !state.to && +b.dataset.days === state.days));
  $("from").value = state.from; $("to").value = state.to;
  document.querySelectorAll("#sigpicker button").forEach((b, i) => {
    b.classList.toggle("on", i < state.sig);
    b.setAttribute("aria-checked", String(i + 1 === state.sig));
  });
  $("sig-hint").textContent = `${state.sig} of 5: ${SIG_HINTS[state.sig - 1]}. Applies to kept items.`;
  document.querySelectorAll("#keepseg button").forEach((b) => b.classList.toggle("on", b.dataset.keep === state.keep));
  document.querySelectorAll("#rateseg button").forEach((b) => b.classList.toggle("on", b.dataset.rate === state.rate));
  $("source").value = state.source; $("q").value = state.q; $("sort").value = state.sort;
}

function renderCats() {
  const counts = {};
  for (const x of filtered(true)) counts[x.category] = (counts[x.category] || 0) + 1;
  $("cats").innerHTML = Object.entries(CATS).map(([k, v]) =>
    `<label><input type="checkbox" value="${k}" ${state.cats.includes(k) ? "checked" : ""}>` +
    `<span class="sw" style="background:var(--c-${k})"></span>${v}<span class="n">${counts[k] || 0}</span></label>`).join("");
}

function renderHist(rows) {
  const [a] = range();
  const first = DATA.items.at(-1)?.date || isoDay(new Date());
  const start = a === "0000" || a < first ? first : a;
  const d0 = new Date(start + "T00:00:00Z"), d1 = new Date(isoDay(new Date()) + "T00:00:00Z");
  const days = Math.max(1, Math.round((d1 - d0) / 864e5) + 1);
  const step = days > 120 ? 7 : 1;
  const n = Math.ceil(days / step);
  const kept = new Array(n).fill(0), drop = new Array(n).fill(0);
  for (const x of rows) {
    const i = Math.floor((new Date(x.date + "T00:00:00Z") - d0) / 864e5 / step);
    if (i >= 0 && i < n) (x.kept ? kept : drop)[i]++;
  }
  const max = Math.max(1, ...kept.map((k, i) => k + drop[i]));
  $("hist").innerHTML = kept.map((k, i) =>
    `<div title="${k} kept, ${drop[i]} dropped"><span class="k" style="height:${(k / max) * 48}px"></span><span class="d" style="height:${(drop[i] / max) * 48}px"></span></div>`).join("");
  $("hist-axis").innerHTML = `<span>${isoDay(d0)}</span><span>${step === 7 ? "per week" : "per day"}</span><span>today</span>`;
}

function renderList() {
  const rows = filtered();
  const stories = {};
  for (const x of rows) if (x.kept && x.story) stories[x.story] = (stories[x.story] || 0) + 1;
  rows.sort(state.sort === "date"
    ? (a, b) => b.date.localeCompare(a.date) || b.sig - a.sig
    : (a, b) => (b.kept - a.kept) || b.sig - a.sig || b.date.localeCompare(a.date));
  const kept = rows.filter((x) => x.kept).length;
  $("count").innerHTML = `<strong>${rows.length}</strong> ${rows.length === 1 ? "item" : "items"}` +
    (state.keep === "all" ? `, ${kept} kept and ${rows.length - kept} dropped` : "");
  renderHist(rows);
  if (!rows.length) {
    $("list").innerHTML = `<li class="empty">Nothing matches these filters. Widen the period, lower the significance, or include dropped items.</li>`;
    return;
  }
  $("list").innerHTML = rows.slice(0, 400).map((x) => {
    const r = ratings[x.id] || 0;
    const covered = x.kept && stories[x.story] > 1 ? `<span>${stories[x.story]} items on this story</span>` : "";
    return `<li class="item ${x.kept ? "" : "dropped"}" style="--cc:var(--c-${x.category})">
      ${signal(x.sig)}
      <h3><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h3>
      <div class="meta"><span class="cat">${CATS[x.category] || x.category}</span><span>${esc(x.source)}</span><time datetime="${x.date}">${x.date}</time>${covered}</div>
      ${x.kept ? `<p class="summary">${esc(x.summary)}</p>${x.why ? `<p class="why"><b>Why it matters:</b> ${esc(x.why)}</p>` : ""}`
               : `<p class="rule"><span>${esc(x.rule)}</span>${esc(x.reason.includes(":") ? x.reason.split(":").slice(1).join(":").trim() : (x.reason === x.rule ? "" : x.reason))}</p>`}
      <div class="acts">
        <button data-rate-id="${x.id}" data-v="1" aria-pressed="${r === 1}">Useful</button>
        <button data-rate-id="${x.id}" data-v="-1" aria-pressed="${r === -1}">Not useful</button>
      </div>
    </li>`;
  }).join("");
}

function render() {
  store.set("aibw.filters", state);
  renderControls(); renderCats(); renderList();
}

function renderDigest(date) {
  const d = DATA.digests.find((x) => x.date === date) || DATA.digests[0];
  if (!d) { $("digest-body").innerHTML = `<p class="empty">No digest yet. Run the weekly digest workflow to create the first one.</p>`; return; }
  $("digest-body").innerHTML = marked.parse(d.markdown, { breaks: true })
    .replace(/[●○]{5}/g, (m) => signal(m.split("").filter((c) => c === "●").length));
  $("digest-body").querySelectorAll("a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
}

function showView(v) {
  document.querySelectorAll(".views button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === v)));
  $("view-digest").hidden = v !== "digest";
  $("view-explorer").hidden = v !== "explorer";
  document.title = v === "explorer" ? "Explorer | AI & BI Watch" : "AI & BI Watch";
  window.scrollTo(0, 0);
}
const viewFromHash = () => (location.hash === "#explorer" ? "explorer" : "digest");
window.addEventListener("hashchange", () => showView(viewFromHash()));

function wire() {
  document.querySelectorAll(".views button").forEach((b) => b.onclick = () => { location.hash = b.dataset.view; });
  document.querySelectorAll("#presets button").forEach((b) => b.onclick = () => { state.days = +b.dataset.days; state.from = state.to = ""; render(); });
  $("from").onchange = (e) => { state.from = e.target.value; render(); };
  $("to").onchange = (e) => { state.to = e.target.value; render(); };
  $("sigpicker").innerHTML = [1,2,3,4,5].map((i) => `<button role="radio" aria-label="${i} of 5" data-sig="${i}"></button>`).join("");
  document.querySelectorAll("#sigpicker button").forEach((b) => b.onclick = () => { state.sig = +b.dataset.sig; render(); });
  document.querySelectorAll("#keepseg button").forEach((b) => b.onclick = () => { state.keep = b.dataset.keep; render(); });
  document.querySelectorAll("#rateseg button").forEach((b) => b.onclick = () => { state.rate = b.dataset.rate; render(); });
  $("cats").onchange = (e) => {
    const v = e.target.value;
    state.cats = e.target.checked ? [...new Set([...state.cats, v])] : state.cats.filter((c) => c !== v);
    render();
  };
  $("cats-all").onclick = () => { state.cats = Object.keys(CATS); render(); };
  $("cats-none").onclick = () => { state.cats = []; render(); };
  $("source").onchange = (e) => { state.source = e.target.value; render(); };
  let t; $("q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; store.set("aibw.filters", state); renderCats(); renderList(); }, 150); };
  $("sort").onchange = (e) => { state.sort = e.target.value; render(); };
  $("list").onclick = (e) => {
    const b = e.target.closest("button[data-rate-id]"); if (!b) return;
    const id = b.dataset.rateId, v = +b.dataset.v;
    if (ratings[id] === v) delete ratings[id]; else ratings[id] = v;
    store.set("aibw.ratings", ratings);
    b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(ratings[id] === +x.dataset.v)));
  };
  $("export").onclick = () => {
    const rows = Object.entries(ratings).map(([id, v]) => ({ id, rating: v, ...(DATA.items.find((x) => x.id === id) || {}) }));
    const blob = new Blob([JSON.stringify(rows, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ai-bi-watch-ratings.json"; a.click();
  };
  $("filters-toggle").onclick = () => {
    const open = $("filters").classList.toggle("open");
    $("filters-toggle").setAttribute("aria-expanded", String(open));
  };
  $("digest-pick").onchange = (e) => renderDigest(e.target.value);
}

fetch("data.json", { cache: "no-cache" }).then((r) => r.json()).then((data) => {
  DATA = data;
  $("built").textContent = "Updated " + new Date(data.built).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  const sources = [...new Set(data.items.map((x) => x.source))].sort();
  $("source").innerHTML += sources.map((s) => `<option>${esc(s)}</option>`).join("");
  if (state.source && !sources.includes(state.source)) state.source = "";
  $("digest-pick").innerHTML = data.digests.map((d) => `<option value="${d.date}">${d.date}</option>`).join("");
  renderDigest(data.digests[0]?.date);
  render();
}).catch(() => {
  $("digest-body").innerHTML = `<p class="empty">Couldn't load data.json. If you opened this file directly, serve the folder instead: python -m http.server -d _site</p>`;
});

wire();
showView(viewFromHash());
</script>
</body>
</html>
